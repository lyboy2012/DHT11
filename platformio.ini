[env:esp32dev]
platform = espressif32
board = esp32dev            ; 经典 ESP32-D0WD-V3 (双核 240MHz) -> Espressif ESP32 Dev Module
framework = arduino

; 锁定 arduino 框架版本 = espressif32@7.1.3 官方匹配的 2.0.17。
; 与同级 led / wifi 项目保持完全一致，几个工程共用同一份 framework 包，无需重复下载。
;
; 为什么不用 registry 最新的 4.30312.261001 (core 3.3.12)：
;   1) framework 3.3.12 的 tools/platformio-build.py 会去找独立的
;      framework-arduinoespressif32-esp32-libs 包，而 platform.json 未声明该依赖；
;   2) 更致命的是该 libs 包(基于 IDF v5.5.5)的 flags/cpp_flags 带
;      `-mdisable-hardware-atomics`，需要 GCC 14/15，而本平台为经典 ESP32
;      指定的 toolchain-xtensa-esp32 是 GCC 8.4，直接报 unrecognized option；
;   3) 平台声明的 toolchain-xtensa-esp-elf(305MB) 二进制前缀是 xtensa-esp-elf-*，
;      与平台为该板型生成的 xtensa-esp32-elf-* 不匹配，仍不可用。
; 结论：本平台版本只能用 core 2.0.17；该包较大(约246MB)，慢链路上需耐心，
;       传输中断会报 HTTPClientError，重试即可(已下载部分会复用)。
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b

; DHT 驱动库 DHTesp（registry 名: DHT sensor library for ESPx，作者 beegee-tokyo）。
; 选它的原因：
;   1) 只依赖 Arduino 核心，不需要额外的 Adafruit Unified Sensor 传递依赖；
;   2) 内部用状态机读时序，出错会给出具体原因(getStatusString)，比裸 delayMicroseconds 稳；
;   3) 自带体感温度(heat index)、露点(dew point) 换算，省得自己写。
; 钉住 1.19（2023-04 发布的最新版），与 led / wifi 钉 framework 的思路一致：换机器复现同一份代码。
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@1.19

; 经典 ESP32 走板载 USB-UART 桥，Serial 即 UART0
monitor_speed = 115200
monitor_filters = time, direct

; 上传端口：不写时 PlatformIO 会自动探测（推荐，换机器不用改）。
; 机器上串口多、探测错时可显式指定，例如:
; upload_port = /dev/cu.usbserial-A5069RR4
; 握手不稳时可降到 115200
; upload_speed = 115200

board_upload.flash_size = 4MB
